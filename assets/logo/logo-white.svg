<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- White version: for dark backgrounds, no fill on outer rect -->
  <!-- Terminal frame in white outline -->
  <rect x="1" y="1" width="62" height="62" rx="11" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Chevron in green -->
  <polyline points="14,22 26,32 14,42" stroke="#22C55E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Neural nodes all white/green -->
  <circle cx="42" cy="20" r="3" fill="#22C55E"/>
  <circle cx="54" cy="20" r="3" fill="#FFFFFF" fill-opacity="0.6"/>
  <circle cx="36" cy="32" r="3" fill="#FFFFFF"/>
  <circle cx="48" cy="32" r="3" fill="#22C55E"/>
  <circle cx="42" cy="44" r="3" fill="#22C55E"/>
  <circle cx="54" cy="44" r="3" fill="#FFFFFF" fill-opacity="0.6"/>

  <!-- Connections -->
  <line x1="42" y1="20" x2="36" y2="32" stroke="#22C55E" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="54" y1="20" x2="48" y2="32" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="42" y1="20" x2="48" y2="32" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="54" y1="20" x2="36" y2="32" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.25"/>
  <line x1="36" y1="32" x2="42" y2="44" stroke="#22C55E" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="48" y1="32" x2="54" y2="44" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="36" y1="32" x2="54" y2="44" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.25"/>
  <line x1="48" y1="32" x2="42" y2="44" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3"/>
</svg>
